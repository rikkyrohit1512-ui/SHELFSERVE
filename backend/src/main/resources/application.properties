server.port=8080

# MySQL Database Connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shelfsense_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
# Hibernate / JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Automatic SQL Seeding (Runs data.sql if database tables are empty)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true


# Cloud MySQL connection pool
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=120000
spring.datasource.hikari.keepalive-time=0
